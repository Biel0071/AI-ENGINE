name: grg-fenix-enterprise

services:
  api:
    build: .
    image: grg/fenix:${FENIX_VERSION:-1.0.0-rc.1}
    restart: unless-stopped
    command: ["node", "src/server.js"]
    environment: &fenix-environment
      FENIX_ENV: production
      PORT: 4400
      FENIX_BIND_HOST: 0.0.0.0
      POSTGRES_DB: ${POSTGRES_DB:-fenix}
      POSTGRES_USER: ${POSTGRES_USER:-fenix}
      FENIX_QDRANT_URL: http://qdrant:6333
      FENIX_S3_ENDPOINT: http://minio:9000
      FENIX_S3_BUCKET: ${FENIX_S3_BUCKET:-fenix}
      FENIX_S3_REGION: ${FENIX_S3_REGION:-us-east-1}
      FENIX_S3_FORCE_PATH_STYLE: "1"
      FENIX_DEPLOY_DRIVER: docker
      FENIX_DEPLOY_DOCKER_NETWORK: grg-fenix-enterprise_fenix-runtime
      DOCKER_HOST: unix:///run/docker.sock
      FENIX_IDENTITY_PROVIDER: spiffe
      FENIX_SPIFFE_TRUST_DOMAIN: ${FENIX_SPIFFE_TRUST_DOMAIN:-grg.internal}
      FENIX_SPIFFE_CREDENTIAL_REF: ${FENIX_SPIFFE_CREDENTIAL_REF:-spiffe-workload-api}
      FENIX_OIDC_ISSUER: ${FENIX_OIDC_ISSUER:?FENIX_OIDC_ISSUER is required}
      FENIX_OIDC_AUDIENCE: ${FENIX_OIDC_AUDIENCE:?FENIX_OIDC_AUDIENCE is required}
      FENIX_OIDC_JWKS_URI: ${FENIX_OIDC_JWKS_URI:?FENIX_OIDC_JWKS_URI is required}
      FENIX_OIDC_AUTHORIZATION_ENDPOINT: ${FENIX_OIDC_AUTHORIZATION_ENDPOINT:?FENIX_OIDC_AUTHORIZATION_ENDPOINT is required}
      FENIX_OIDC_TOKEN_ENDPOINT: ${FENIX_OIDC_TOKEN_ENDPOINT:?FENIX_OIDC_TOKEN_ENDPOINT is required}
      FENIX_OIDC_CLIENT_ID: ${FENIX_OIDC_CLIENT_ID:-grg-console}
      FENIX_OIDC_REDIRECT_URI: ${FENIX_OIDC_REDIRECT_URI:?FENIX_OIDC_REDIRECT_URI is required}
      FENIX_BOOTSTRAP_OIDC_SUBJECT: ${FENIX_BOOTSTRAP_OIDC_SUBJECT:-grg-admin}
      FENIX_AI_DEFAULT_PROVIDER: ${FENIX_AI_DEFAULT_PROVIDER:?FENIX_AI_DEFAULT_PROVIDER is required}
      FENIX_AI_DEFAULT_MODEL: ${FENIX_AI_DEFAULT_MODEL:?FENIX_AI_DEFAULT_MODEL is required}
      GRG_AIPLATFORM_URL: ${GRG_AIPLATFORM_URL:-}
      FENIX_OPENAI_COMPATIBLE_URL: ${FENIX_OPENAI_COMPATIBLE_URL:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-}
    secrets: &fenix-secrets
      - postgres_password
      - redis_password
      - minio_access_key
      - minio_secret_key
      - ai_provider_key
      - metrics_token
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      qdrant: { condition: service_healthy }
      minio: { condition: service_healthy }
    ports: ["${FENIX_BIND_ADDRESS:-127.0.0.1}:${FENIX_PORT:-4400}:4400"]
    networks: [fenix-backend, fenix-runtime]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    user: "${FENIX_HOST_UID:-1000}:${FENIX_HOST_GID:-1000}"
    volumes:
      - ${FENIX_ROOTLESS_DOCKER_SOCKET:?FENIX_ROOTLESS_DOCKER_SOCKET is required}:/run/docker.sock
    extra_hosts: ["host.containers.internal:host-gateway"]

  worker:
    image: grg/fenix:${FENIX_VERSION:-1.0.0-rc.1}
    restart: unless-stopped
    command: ["node", "src/runtime/worker.js"]
    environment: *fenix-environment
    secrets: *fenix-secrets
    depends_on:
      api: { condition: service_healthy }
    networks: [fenix-backend, fenix-runtime]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    user: "${FENIX_HOST_UID:-1000}:${FENIX_HOST_GID:-1000}"
    volumes:
      - ${FENIX_ROOTLESS_DOCKER_SOCKET:?FENIX_ROOTLESS_DOCKER_SOCKET is required}:/run/docker.sock
    extra_hosts: ["host.containers.internal:host-gateway"]

  postgres:
    image: postgres:17.9-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fenix}
      POSTGRES_USER: ${POSTGRES_USER:-fenix}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - fenix-postgres:/var/lib/postgresql/data
      - ./src/infrastructure/database/migrations/0001_kernel_state.sql:/docker-entrypoint-initdb.d/0001_kernel_state.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    networks: [fenix-backend]

  redis:
    image: redis:7.2.14-alpine
    restart: unless-stopped
    command:
      - /bin/sh
      - -ec
      - |
        umask 077
        printf 'appendonly yes\nrequirepass %s\n' "$$(cat /run/secrets/redis_password)" > /tmp/fenix-redis.conf
        exec redis-server /tmp/fenix-redis.conf
    volumes:
      - fenix-redis:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$(cat /run/secrets/redis_password) redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    secrets:
      - redis_password
    security_opt:
      - no-new-privileges:true
    networks: [fenix-backend]

  qdrant:
    image: qdrant/qdrant:v1.18.3-unprivileged
    restart: unless-stopped
    volumes:
      - fenix-qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    networks: [fenix-backend]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        export MINIO_ROOT_USER="$$(cat /run/secrets/minio_access_key)"
        export MINIO_ROOT_PASSWORD="$$(cat /run/secrets/minio_secret_key)"
        exec minio server /data --console-address :9001
    volumes: ["fenix-minio:/data"]
    secrets: [minio_access_key, minio_secret_key]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [fenix-backend]
    security_opt: ["no-new-privileges:true"]

  prometheus:
    image: prom/prometheus:v3.4.1
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ./ops/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - fenix-prometheus:/prometheus
    secrets: [metrics_token]
    depends_on:
      api: { condition: service_healthy }
    networks: [fenix-backend]
    security_opt: ["no-new-privileges:true"]

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    restart: unless-stopped
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        export KC_BOOTSTRAP_ADMIN_PASSWORD="$$(cat /run/secrets/keycloak_admin_password)"
        export KC_DB_PASSWORD="$$(cat /run/secrets/postgres_password)"
        exec /opt/keycloak/bin/kc.sh start --optimized --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: fenix-admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-fenix}
      KC_DB_USERNAME: ${POSTGRES_USER:-fenix}
      KC_DB_SCHEMA: keycloak
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: ${FENIX_PUBLIC_URL:?FENIX_PUBLIC_URL is required}/auth
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      JAVA_OPTS_KC_HEAP: -Xms128m -Xmx512m
    volumes:
      - ./ops/keycloak/grg-realm.json:/opt/keycloak/data/import/grg-realm.json:ro
    secrets: [postgres_password, keycloak_admin_password]
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["${FENIX_BIND_ADDRESS:-127.0.0.1}:4401:8080"]
    networks: [fenix-backend]
    mem_limit: 768m
    security_opt: ["no-new-privileges:true"]

  keycloak-bootstrap:
    image: quay.io/keycloak/keycloak:26.7.0
    restart: "no"
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        until /opt/keycloak/bin/kcadm.sh config credentials --server http://keycloak:8080/auth --realm master --user fenix-admin --password "$$(cat /run/secrets/keycloak_admin_password)"; do sleep 5; done
        USER_ID="$$('/opt/keycloak/bin/kcadm.sh' get users -r grg -q username=grg-admin --fields id --format csv --noquotes | head -1)"
        if [ -z "$$USER_ID" ]; then USER_ID="$$('/opt/keycloak/bin/kcadm.sh' create users -r grg -s username=grg-admin -s enabled=true -s emailVerified=true -i)"; fi
        /opt/keycloak/bin/kcadm.sh set-password -r grg --userid "$$USER_ID" --new-password "$$(cat /run/secrets/keycloak_user_password)"
        /opt/keycloak/bin/kcadm.sh add-roles -r grg --uid "$$USER_ID" --rolename master_admin
    secrets: [keycloak_admin_password, keycloak_user_password]
    depends_on: [keycloak]
    networks: [fenix-backend]
    security_opt: ["no-new-privileges:true"]

volumes:
  fenix-postgres:
  fenix-redis:
  fenix-qdrant:
  fenix-minio:
  fenix-prometheus:

networks:
  fenix-backend:
    internal: true
  fenix-runtime:

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:?POSTGRES_PASSWORD_FILE is required}
  redis_password:
    file: ${REDIS_PASSWORD_FILE:?REDIS_PASSWORD_FILE is required}
  minio_access_key:
    file: ${MINIO_ACCESS_KEY_FILE:?MINIO_ACCESS_KEY_FILE is required}
  minio_secret_key:
    file: ${MINIO_SECRET_KEY_FILE:?MINIO_SECRET_KEY_FILE is required}
  ai_provider_key:
    file: ${AI_PROVIDER_KEY_FILE:?AI_PROVIDER_KEY_FILE is required}
  metrics_token:
    file: ${METRICS_TOKEN_FILE:?METRICS_TOKEN_FILE is required}
  keycloak_admin_password:
    file: ${KEYCLOAK_ADMIN_PASSWORD_FILE:?KEYCLOAK_ADMIN_PASSWORD_FILE is required}
  keycloak_user_password:
    file: ${KEYCLOAK_USER_PASSWORD_FILE:?KEYCLOAK_USER_PASSWORD_FILE is required}
