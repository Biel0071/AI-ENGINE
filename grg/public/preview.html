<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: system-ui; margin: 0; background: #0f111a; color: #fff; display: flex; align-items: center; justify-content: center; height: 100vh; }
    .card { background: #1a1d2d; padding: 30px; border-radius: 12px; width: 300px; text-align: center; border: 1px solid #2a2d3d; }
    h2 { margin-top: 0; color: #fff; }
    p { color: #8892b0; font-size: 14px; }
    .btn-action { background: #e63946; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 15px; width: 100%; transition: background 0.2s; }
    .btn-action:hover { background: #f04b57; }
  </style>
</head>
<body>
  <div class="card" id="mainCard">
    <h2 id="cardTitle">Deploy Application</h2>
    <p class="description">Click the button below to trigger the deployment pipeline.</p>
    <button class="btn-action" id="deployBtn">Start Deployment</button>
  </div>
</body>
</html>
