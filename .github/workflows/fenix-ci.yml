name: FENIX CI
on:
  push:
    paths: ["grg/**", "docs/**", ".github/workflows/fenix-ci.yml"]
  pull_request:
    paths: ["grg/**", "docs/**", ".github/workflows/fenix-ci.yml"]
permissions:
  contents: read
  security-events: write
jobs:
  test-and-sbom:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: grg } }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: "22.17.1", cache: npm, cache-dependency-path: grg/package-lock.json, package-manager-cache: false }
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm sbom --sbom-format spdx > fenix-sbom.spdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: fenix-sbom, path: grg/fenix-sbom.spdx.json, if-no-files-found: error }
  codeql:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: github/codeql-action/init@adfda868f108ac4222129de456ea554034a27db7 # v4
        with: { languages: javascript-typescript, queries: security-extended }
      - uses: github/codeql-action/analyze@adfda868f108ac4222129de456ea554034a27db7 # v4
  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: docker build --pull --tag grg/fenix:ci grg
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0, immutable commit
        with: { image-ref: "grg/fenix:ci", format: table, exit-code: "1", ignore-unfixed: true, severity: "CRITICAL,HIGH" }
